<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>XHS Research Studio</title><link rel="stylesheet" href="/style.css"></head><body>
<header><div><span class="eyebrow">XIAOHONGSHU INTELLIGENCE</span><h1>XHS Research Studio</h1><p>把 Harvest JSON 变成可卖的研究交付：项目、快照、变化、评论信号与证据链。</p></div><button id="demoBtn" class="secondary">载入 Demo</button></header>
<main><aside><section><h2>新建项目</h2><form id="projectForm"><input name="name" placeholder="项目名" required><input name="client" placeholder="客户/品牌"><input name="category" placeholder="品类"><textarea name="keywords" placeholder="关键词，每行一个"></textarea><textarea name="competitors" placeholder="竞品，每行一个"></textarea><button>创建项目</button></form></section><section><div class="row"><h2>项目</h2><button id="refreshBtn" class="link">刷新</button></div><div id="projects" class="projects"></div></section></aside>
<section class="workspace"><div id="empty" class="empty"><h2>先创建或载入一个项目</h2><p>产品层不负责绕过平台限制；它负责把已有公开数据变成可复用的研究资产。</p></div><div id="projectView" hidden><div class="projectHead"><div><span id="projectMeta" class="eyebrow"></span><h2 id="projectName"></h2></div><button id="planBtn" class="secondary">复制 Harvest 计划</button></div><div class="tabs"><button data-tab="overview" class="active">概览</button><button data-tab="ingest">导入数据</button><button data-tab="evidence">证据</button><button data-tab="report">报告</button></div><div id="overview" class="tab active"><div id="metrics" class="metrics"></div><div class="grid2"><section class="card"><h3>评论信号</h3><div id="signals"></div></section><section class="card"><h3>高频主题</h3><div id="terms" class="chips"></div></section></div><section class="card"><div class="row"><h3>高信号笔记</h3><button id="diffBtn" class="link">对比最近两次</button></div><div id="topNotes"></div></section><section class="card" id="diffCard" hidden><h3>变化</h3><div id="diff"></div></section></div><div id="ingest" class="tab"><section class="card"><h3>导入 Harvest JSON</h3><p>接受现有 Skill 的 schema，也兼容 v2 的 comments / queries / sourceUrl 字段。</p><input id="fileInput" type="file" accept="application/json"><textarea id="jsonInput" class="json" placeholder='粘贴 {"source":...,"notes":...}'></textarea><button id="ingestBtn">保存为新快照</button><div id="ingestStatus"></div></section></div><div id="evidence" class="tab"><section class="card"><h3>证据表</h3><div id="evidenceTable"></div></section></div><div id="report" class="tab"><section class="card"><div class="row"><h3>客户可读报告</h3><div><button id="csvBtn" class="secondary">导出 CSV</button> <button id="copyReport" class="secondary">复制 Markdown</button></div></div><pre id="reportText"></pre></section></div></div></section></main><script src="/app.js"></script></body></html>
