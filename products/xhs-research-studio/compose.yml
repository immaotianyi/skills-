services:
  xhs-research-studio:
    build: .
    ports:
      - "127.0.0.1:5418:5418"
    environment:
      # Local mode remains the safe default. Set to 1 only behind a configured
      # public HTTPS origin / reverse proxy for hosted paid-beta deployments.
      XHS_STUDIO_HOSTED: "${XHS_STUDIO_HOSTED:-0}"
      XHS_STUDIO_PUBLIC_URL: "${XHS_STUDIO_PUBLIC_URL:-}"
      XHS_STUDIO_TRUST_PROXY: "${XHS_STUDIO_TRUST_PROXY:-0}"

      XHS_STUDIO_INTEGRITY_KEY: "${XHS_STUDIO_INTEGRITY_KEY:-}"
      XHS_STUDIO_INTEGRITY_KEY_ID: "${XHS_STUDIO_INTEGRITY_KEY_ID:-local-v1}"
      XHS_STUDIO_INTEGRITY_KEYRING: "${XHS_STUDIO_INTEGRITY_KEYRING:-}"
      XHS_STUDIO_PACK_INTEGRITY_KEY: "${XHS_STUDIO_PACK_INTEGRITY_KEY:-}"
      XHS_STUDIO_PACK_INTEGRITY_KEY_ID: "${XHS_STUDIO_PACK_INTEGRITY_KEY_ID:-pack-v1}"

      XHS_STUDIO_HARVEST_EXECUTOR: "${XHS_STUDIO_HARVEST_EXECUTOR:-}"
      XHS_STUDIO_HARVEST_EXECUTOR_ARGS: "${XHS_STUDIO_HARVEST_EXECUTOR_ARGS:-}"
      XHS_STUDIO_SYNTHESIS_EXECUTOR: "${XHS_STUDIO_SYNTHESIS_EXECUTOR:-}"
      XHS_STUDIO_SYNTHESIS_EXECUTOR_ARGS: "${XHS_STUDIO_SYNTHESIS_EXECUTOR_ARGS:-}"
      XHS_STUDIO_OPENAI_API_KEY: "${XHS_STUDIO_OPENAI_API_KEY:-}"
      XHS_STUDIO_OPENAI_MODEL: "${XHS_STUDIO_OPENAI_MODEL:-}"

      XHS_STUDIO_STRIPE_SECRET_KEY: "${XHS_STUDIO_STRIPE_SECRET_KEY:-}"
      XHS_STUDIO_STRIPE_WEBHOOK_SECRET: "${XHS_STUDIO_STRIPE_WEBHOOK_SECRET:-}"
      XHS_STUDIO_STRIPE_PRICE_PILOT: "${XHS_STUDIO_STRIPE_PRICE_PILOT:-}"
      XHS_STUDIO_STRIPE_PRICE_PRO: "${XHS_STUDIO_STRIPE_PRICE_PRO:-}"
      XHS_STUDIO_STRIPE_PORTAL_CONFIGURATION_ID: "${XHS_STUDIO_STRIPE_PORTAL_CONFIGURATION_ID:-}"
      XHS_STUDIO_BILLING_PLANS_JSON: "${XHS_STUDIO_BILLING_PLANS_JSON:-}"

      XHS_STUDIO_SCHEDULER_TICK_MS: "${XHS_STUDIO_SCHEDULER_TICK_MS:-30000}"
      XHS_STUDIO_MAX_BODY: "${XHS_STUDIO_MAX_BODY:-15000000}"
    volumes:
      - xhs_studio_data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  xhs_studio_data:
