name: XHS Research Studio Quality Gate

on:
  pull_request:
    paths:
      - 'products/xhs-research-studio/**'
      - '.skills/03-domains/xiaohongshu-harvest.yaml'
      - '.github/workflows/xhs-research-studio-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'products/xhs-research-studio/**'
      - '.skills/03-domains/xiaohongshu-harvest.yaml'

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check products/xhs-research-studio/server.mjs
          node --check products/xhs-research-studio/server-v2.mjs
          node --check products/xhs-research-studio/public/app.js
          node --check products/xhs-research-studio/cli.mjs
          node --check products/xhs-research-studio/lib/normalize.mjs
          node --check products/xhs-research-studio/lib/analysis.mjs
          node --check products/xhs-research-studio/lib/storage.mjs
          node --check products/xhs-research-studio/lib/validation.mjs
          node --check products/xhs-research-studio/smoke-test.mjs
      - name: Core unit and regression tests
        run: node --test products/xhs-research-studio/test/*.test.mjs
      - name: End-to-end API smoke test
        run: node products/xhs-research-studio/smoke-test.mjs
      - name: Build hardened container
        run: docker build -t xhs-research-studio:test products/xhs-research-studio
      - name: Container health smoke
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --rm --name xhs-research-studio-test -p 127.0.0.1:55419:5418 xhs-research-studio:test
          cleanup() { docker logs xhs-research-studio-test || true; docker stop xhs-research-studio-test || true; }
          trap cleanup EXIT
          for i in {1..40}; do
            if curl --fail --silent http://127.0.0.1:55419/api/health > /tmp/xhs-health.json; then
              cat /tmp/xhs-health.json
              exit 0
            fi
            sleep 0.25
          done
          echo 'container health endpoint did not become ready' >&2
          exit 1
