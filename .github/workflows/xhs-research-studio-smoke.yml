name: XHS Research Studio Quality Gate

on:
  pull_request:
    paths:
      - 'products/xhs-research-studio/**'
      - '.skills/03-domains/xiaohongshu-harvest.yaml'
      - '.github/workflows/xhs-research-studio-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'products/xhs-research-studio/**'
      - '.skills/03-domains/xiaohongshu-harvest.yaml'
      - '.github/workflows/xhs-research-studio-smoke.yml'

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Syntax check
        run: |
          node --check products/xhs-research-studio/server.mjs
          node --check products/xhs-research-studio/server-v2.mjs
          node --check products/xhs-research-studio/server-v3.mjs
          node --check products/xhs-research-studio/public/app.js
          node --check products/xhs-research-studio/public/runs-ui.js
          node --check products/xhs-research-studio/public/pack-v12.js
          node --check products/xhs-research-studio/public/hosted-ui.js
          node --check products/xhs-research-studio/cli.mjs
          node --check products/xhs-research-studio/evaluate-signals.mjs
          node --check products/xhs-research-studio/export-signed-pack.mjs
          node --check products/xhs-research-studio/browser-smoke.mjs
          node --check products/xhs-research-studio/hosted-smoke.mjs
          node --check products/xhs-research-studio/hosted-browser-smoke.mjs
          node --check products/xhs-research-studio/lib/normalize.mjs
          node --check products/xhs-research-studio/lib/analysis.mjs
          node --check products/xhs-research-studio/lib/storage.mjs
          node --check products/xhs-research-studio/lib/validation.mjs
          node --check products/xhs-research-studio/lib/integrity.mjs
          node --check products/xhs-research-studio/lib/evaluation.mjs
          node --check products/xhs-research-studio/lib/evidence-pack.mjs
          node --check products/xhs-research-studio/lib/runs.mjs
          node --check products/xhs-research-studio/lib/executor.mjs
          node --check products/xhs-research-studio/lib/schedules.mjs
          node --check products/xhs-research-studio/lib/run-service.mjs
          node --check products/xhs-research-studio/lib/run-http.mjs
          node --check products/xhs-research-studio/lib/hosted-db.mjs
          node --check products/xhs-research-studio/lib/hosted-policy.mjs
          node --check products/xhs-research-studio/lib/billing.mjs
          node --check products/xhs-research-studio/lib/hosted-http.mjs
          node --check products/xhs-research-studio/lib/hosted-members.mjs
          node --check products/xhs-research-studio/lib/hosted-members-http.mjs
          node --check products/xhs-research-studio/lib/synthesis.mjs
          node --check products/xhs-research-studio/smoke-test.mjs
      - name: Core unit, security, compatibility, and scale tests
        run: node --test --test-concurrency=4 products/xhs-research-studio/test/*.test.mjs
      - name: End-to-end API smoke test
        run: node products/xhs-research-studio/smoke-test.mjs
      - name: Hosted paid-beta API smoke test
        run: node products/xhs-research-studio/hosted-smoke.mjs
      - name: Headless Chrome UI end-to-end smoke
        run: node products/xhs-research-studio/browser-smoke.mjs
      - name: Hosted Headless Chrome self-service smoke
        run: node products/xhs-research-studio/hosted-browser-smoke.mjs
      - name: Build hardened container
        run: docker build -t xhs-research-studio:test products/xhs-research-studio
      - name: Container non-root, persistence, restart, and executor gate
        shell: bash
        run: |
          set -euo pipefail
          volume=xhs-studio-test-data
          name=xhs-research-studio-test
          cleanup() {
            docker stop "$name" >/dev/null 2>&1 || true
            docker rm -f "$name" >/dev/null 2>&1 || true
            docker volume rm "$volume" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker volume create "$volume" >/dev/null
          start_container() {
            mode="${1:-manual}"
            extra=()
            docker rm -f "$name" >/dev/null 2>&1 || true
            if [ "$mode" = "executor" ]; then
              extra+=(
                -e XHS_STUDIO_HARVEST_EXECUTOR=node
                -e 'XHS_STUDIO_HARVEST_EXECUTOR_ARGS=["test/fixtures/mock-harvest-executor.mjs"]'
                -e XHS_EXECUTOR_FIXTURE_PATH=/app/public/demo-harvest.json
                -e XHS_EXECUTOR_MODE=success
              )
            fi
            docker run -d --rm --name "$name" \
              --read-only --tmpfs /tmp --security-opt no-new-privileges:true \
              -v "$volume":/data -p 127.0.0.1:55419:5418 \
              "${extra[@]}" xhs-research-studio:test >/dev/null
          }
          wait_health() {
            for i in {1..40}; do
              if curl --fail --silent http://127.0.0.1:55419/api/health > /tmp/xhs-health.json; then
                cat /tmp/xhs-health.json
                return 0
              fi
              sleep 0.25
            done
            echo 'container health endpoint did not become ready' >&2
            docker logs "$name" || true
            return 1
          }

          start_container manual
          wait_health
          uid="$(docker exec "$name" id -u)"
          test "$uid" != "0"
          echo "container uid=$uid"
          curl --fail --silent http://127.0.0.1:55419/api/run-system > /tmp/xhs-run-system.json
          grep -q '"executorConfigured": false' /tmp/xhs-run-system.json
          curl --fail --silent \
            -H 'content-type: application/json' \
            -d '{"name":"Container Persisted Project","keywords":["防晒"]}' \
            http://127.0.0.1:55419/api/projects > /tmp/xhs-project.json
          grep -q 'Container Persisted Project' /tmp/xhs-project.json

          docker stop "$name" >/dev/null
          start_container manual
          wait_health
          curl --fail --silent http://127.0.0.1:55419/api/projects > /tmp/xhs-projects.json
          grep -q 'Container Persisted Project' /tmp/xhs-projects.json
          echo 'container persistence restart check passed'

          docker stop "$name" >/dev/null
          start_container executor
          wait_health
          curl --fail --silent http://127.0.0.1:55419/api/run-system > /tmp/xhs-run-system-executor.json
          grep -q '"executorConfigured": true' /tmp/xhs-run-system-executor.json
          curl --fail --silent \
            -H 'content-type: application/json' \
            -d '{"name":"Container Executor Project","keywords":["防晒"]}' \
            http://127.0.0.1:55419/api/projects > /tmp/xhs-executor-project.json
          project_id="$(node -e "const fs=require('fs');process.stdout.write(JSON.parse(fs.readFileSync('/tmp/xhs-executor-project.json','utf8')).id)")"
          curl --fail --silent \
            -H 'content-type: application/json' \
            -d '{"budget":{"maxNotes":20,"maxComments":100,"maxSeconds":30}}' \
            "http://127.0.0.1:55419/api/projects/${project_id}/runs" > /tmp/xhs-executor-launch.json
          completed=0
          for i in {1..80}; do
            curl --fail --silent "http://127.0.0.1:55419/api/projects/${project_id}/runs" > /tmp/xhs-executor-runs.json
            if grep -q '"state": "completed"' /tmp/xhs-executor-runs.json; then
              completed=1
              break
            fi
            if grep -q '"state": "failed"' /tmp/xhs-executor-runs.json; then
              cat /tmp/xhs-executor-runs.json
              echo 'configured container executor run failed' >&2
              exit 1
            fi
            sleep 0.1
          done
          test "$completed" = "1"
          curl --fail --silent "http://127.0.0.1:55419/api/projects/${project_id}/snapshots" > /tmp/xhs-executor-snapshots.json
          node -e "const fs=require('fs');const v=JSON.parse(fs.readFileSync('/tmp/xhs-executor-snapshots.json','utf8'));if(!Array.isArray(v.snapshots)||v.snapshots.length<1)process.exit(1)"
          echo 'container configured executor -> snapshot check passed'
